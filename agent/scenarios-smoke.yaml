# Four scenarios, not twenty-five: one plain order and the three catering paths.
# Run this while iterating; run scenarios.yaml once before a demo.
#   lk agent simulate --scenarios scenarios-smoke.yaml src/agent.py

name: Hire Slice smoke
scenarios:
- label: Pizza with the size already stated
  instructions: 'You are Sam Reyes and you know exactly what you want.


    Goals:

    - Open with "a large cheese pizza, please".

    - Decline anything else.

    - Pickup. Name Sam, phone 5551230188.

    - Say yes when the agent reads the whole order back. Stay on the line until it
    gives you an order code.'
  agent_expectations: 'The agent must add the pizza immediately without asking what size,
    since the size was already given. It must not ask about toppings.

    '
  tags:
    feature: sizing
  userdata:
    expected_state:
      lines:
      - item: cheese
        size: large
        qty: 1
      fulfillment: pickup
      confirmed: true
- label: Caller orders forty pizzas for a party
  instructions: 'You are Priya Raman, organising a school event. You genuinely want forty.


    Goals:

    - Ask for forty large cheese pizzas.

    - When the agent checks whether forty is right, say yes.

    - When told it needs booking, say you want them tomorrow at six.

    - When asked pickup or delivery, say you''ll collect them.

    - Give name Priya and phone 5551230299.

    - Answer briefly and say yes as soon as the order is read back.'
  agent_expectations: 'The agent does not refuse the order and does not promise it in twenty
    minutes. It checks that forty is the intended number, tells the caller an order this size
    needs about three hours, books it for tomorrow at six, and says a payment link will be
    texted and the order is confirmed once it is paid in full. It must never ask for card
    details, and must never say the payment has already been taken.

    '
  tags:
    feature: catering
  userdata:
    expected_state:
      lines:
      - item: cheese
        size: large
        qty: 40
      fulfillment: pickup
      confirmed: true
- label: Catering order for delivery
  instructions: 'You are Odell Bram, feeding a job site. You want it delivered.


    Goals:

    - Ask for thirty large pepperoni pizzas, delivered.

    - When the agent checks whether thirty is right, say yes.

    - When it asks for a time, say tomorrow at noon.

    - Give the address 3300 Chimney Rock Road, Houston Texas 77081.

    - Name Odell, phone 5551230311.

    - Say yes when the agent reads the whole order back. Stay on the line until it
    gives you an order code.'
  agent_expectations: 'The agent takes the address as part of setting delivery rather than
    refusing, books the order for tomorrow at noon, and states a total that includes the delivery
    fee. It says a payment link is coming and that the order is confirmed once it is paid
    in full. It places the order and gives a code.

    '
  tags:
    feature: catering
  userdata:
    expected_state:
      lines:
      - item: pepperoni
        size: large
        qty: 30
      fulfillment: delivery
      has_address: true
      confirmed: true
- label: Catering caller changes their mind to pickup mid-address
  instructions: 'You are Wren Halloway and you decide collecting is easier.


    Goals:

    - Ask for thirty large cheese pizzas for delivery.

    - Confirm thirty when asked. Say tomorrow at one when asked for a time.

    - When the agent asks for your address, say "actually, make it pickup".

    - Name Wren, phone 5551230322.

    - Say yes when the agent reads the whole order back. Stay on the line until it
    gives you an order code.'
  agent_expectations: 'The agent switches the order to pickup as soon as the caller says so.
    It must not keep pressing for an address, and the order it places must be pickup with
    no address on it.

    '
  tags:
    feature: catering
  userdata:
    expected_state:
      lines:
      - item: cheese
        size: large
        qty: 30
      fulfillment: pickup
      has_address: false
      confirmed: true
