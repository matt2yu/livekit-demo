# Simulated callers for Hire Slice. Run with:
#   lk agent simulate --scenarios scenarios.yaml
#
# The simulator judges each transcript against `agent_expectations`. Scenarios
# that also carry `expected_state` in userdata are additionally graded against
# the real Order the agent ended up with — see on_simulation_end in src/agent.py.
# A run passes only if both agree.
#
# Per-scenario userdata:
#   expected_state:  the Order the agent must end up with. Omit to grade on the
#                    conversation alone. Keys are all optional:
#                      lines:        [{item, size, qty, toppings}]
#                      fulfillment:  "pickup" | "delivery"
#                      confirmed:    true | false  (whether an order code exists)
#                      has_address:  true | false

name: Pizza ordering
scenarios:
  # --- how the order gets built -------------------------------------------

  - label: Pizza with no size given
    instructions: |-
      You are Dana Okafor, ordering dinner. You are brief and a little
      distracted.

      Goals:
      - Ask for "a pepperoni pizza" without saying what size.
      - When the agent asks what size, say large.
      - Decline the drink or sauce when offered.
      - Say it's for pickup, give your name Dana and phone 5551230145,
        and confirm the order when it's read back to you.
    agent_expectations: >
      The agent must ask which size before adding the pizza — it must not guess
      a size. After the size is given it adds one large pepperoni, and it never
      claims a price or item that wasn't quoted by a tool.
    tags:
      feature: sizing
    userdata:
      expected_state:
        lines:
          - { item: pepperoni, size: large, qty: 1 }
        fulfillment: pickup
        confirmed: true

  - label: Pizza with the size already stated
    instructions: |-
      You are Sam Reyes and you know exactly what you want.

      Goals:
      - Open with "a large cheese pizza, please".
      - Decline anything else.
      - Pickup. Name Sam, phone 5551230188. Confirm when read back.
    agent_expectations: >
      The agent must add the pizza immediately without asking what size, since
      the size was already given. It must not ask about toppings.
    tags:
      feature: sizing
    userdata:
      expected_state:
        lines:
          - { item: cheese, size: large, qty: 1 }
        fulfillment: pickup
        confirmed: true

  - label: Pizza with size and toppings in one breath
    instructions: |-
      You are Priya Nair, ordering for two.

      Goals:
      - Ask for "a medium margherita with mushrooms and olives".
      - Decline anything else, choose pickup, name Priya, phone 5551230199,
        and confirm.
    agent_expectations: >
      The agent adds one medium margherita carrying both mushrooms and olives,
      and the total it quotes includes the topping charge.
    tags:
      feature: toppings
    userdata:
      expected_state:
        lines:
          - { item: margherita, size: medium, qty: 1, toppings: [mushrooms, olives] }
        fulfillment: pickup
        confirmed: true

  - label: Caller asks what drinks and sauces are available
    instructions: |-
      You are Marcus Webb and you want to know the options before committing.

      Goals:
      - Order a large pepperoni pizza.
      - Then ask "what drinks do you have?"
      - Then ask "and what sauces?"
      - Add a medium coke and a ranch.
      - Pickup, name Marcus, phone 5551230122, confirm.
    agent_expectations: >
      The agent names the real drinks (water, coke, sprite) and the real sauces
      (ranch, garlic, marinara, bbq) rather than inventing any, and adds a
      medium coke and one ranch sauce.
    tags:
      feature: menu
    userdata:
      expected_state:
        lines:
          - { item: pepperoni, size: large, qty: 1 }
          - { item: coke, size: medium, qty: 1 }
          - { item: ranch, qty: 1 }
        fulfillment: pickup
        confirmed: true

  - label: Caller changes the quantity mid-order
    instructions: |-
      You are Alex Kim, ordering for a group that just got bigger.

      Goals:
      - Ask for a large cheese pizza.
      - Immediately after it's added, say "actually make that three".
      - Decline extras, choose pickup, name Alex, phone 5551230133, confirm.
    agent_expectations: >
      The agent changes the quantity of the existing pizza to three rather than
      adding a second separate line, and the total reflects three pizzas.
    tags:
      feature: corrections
    userdata:
      expected_state:
        lines:
          - { item: cheese, size: large, qty: 3 }
        fulfillment: pickup
        confirmed: true

  # --- pickup vs delivery --------------------------------------------------

  - label: Delivery with an address
    instructions: |-
      You are Jordan Vance, ordering to your apartment.

      Goals:
      - Ask for a large pepperoni pizza.
      - Decline extras.
      - Say you want it delivered.
      - Give the address 4600 Beechnut Street, apartment 12, Houston Texas
        77096 when asked, and confirm it when it's read back.
      - Name Jordan, phone 5551230177. Confirm the order.
    agent_expectations: >
      The agent collects a delivery address and reads it back for confirmation,
      adds the delivery fee, quotes a delivery time rather than a pickup time,
      and only then places the order.
    tags:
      feature: fulfillment
    userdata:
      expected_state:
        lines:
          - { item: pepperoni, size: large, qty: 1 }
        fulfillment: delivery
        has_address: true
        confirmed: true

  - label: Pickup must not ask for an address
    instructions: |-
      You are Robin Diaz and you are picking the order up yourself.

      Goals:
      - Ask for a medium cheese pizza.
      - Decline extras.
      - Say "pickup".
      - Give name Robin and phone 5551230166 when asked, then confirm.
      - If the agent ever asks for a street address, tell it you are picking up
        and do not provide one.
    agent_expectations: >
      The agent must never ask for a street address, because the order is for
      pickup. It quotes a pickup time, collects only a name and phone number,
      and places the order.
    tags:
      feature: fulfillment
    userdata:
      expected_state:
        lines:
          - { item: cheese, size: medium, qty: 1 }
        fulfillment: pickup
        has_address: false
        confirmed: true

  - label: Caller switches from pickup to delivery after ordering
    instructions: |-
      You are Casey Lin and you change your mind partway through.

      Goals:
      - Order a large margherita and say it's for pickup.
      - After the agent sets pickup, say "actually can you deliver it instead?"
      - Give the address 5150 Braeswood Boulevard, Houston Texas 77096.
      - Name Casey, phone 5551230155.
      - Answer every question in as few words as possible, and say yes the
        moment the order is read back to you.
    agent_expectations: >
      The agent switches the order to delivery, collects an address, and the
      final total it quotes is higher than the pickup total because the
      delivery fee has been added.
    tags:
      feature: fulfillment
    userdata:
      expected_state:
        fulfillment: delivery
        has_address: true
        confirmed: true

  - label: Delivery address is outside the area
    instructions: |-
      You are Sloane Whitaker, ordering from across town.

      Goals:
      - Order a large pepperoni pizza for delivery.
      - Give the address 1500 Louisiana Street, Houston Texas 77002.
      - When told it's out of the delivery area, agree to collect instead.
      - Name Sloane, phone 5551230322. Answer briefly and say yes as soon as the
        order is read back.
    agent_expectations: >
      The agent says clearly that the address is outside the delivery area rather
      than accepting it, offers pickup, and tells the caller where the shop is.
      The order it finally places is for pickup with no delivery fee, and it must
      never promise delivery to that address.
    tags:
      feature: fulfillment
    userdata:
      expected_state:
        lines:
          - { item: pepperoni, size: large, qty: 1 }
        fulfillment: pickup
        has_address: false
        confirmed: true

  # --- refusing things we don't sell ---------------------------------------

  - label: Caller asks for an item that is not on the menu
    instructions: |-
      You are Noor Haddad and you are hungry for something specific.

      Goals:
      - Ask for a calzone.
      - When told there isn't one, ask what they do have.
      - Order a large cheese pizza instead, pickup, name Noor,
        phone 5551230111, and confirm.
    agent_expectations: >
      The agent clearly says calzones are not available and offers real menu
      items instead. It must never claim to have added a calzone.
    tags:
      feature: refusals
    userdata:
      expected_state:
        lines:
          - { item: cheese, size: large, qty: 1 }
        confirmed: true

  - label: Caller asks for a topping we do not carry
    instructions: |-
      You are Eli Barnes with strong opinions about pizza.

      Goals:
      - Ask for a large cheese pizza with pineapple.
      - When told pineapple isn't available, ask what toppings there are and
        pick mushrooms instead.
      - Pickup, name Eli, phone 5551230100, confirm.
    agent_expectations: >
      The agent says pineapple is not an available topping and names real ones.
      It must never claim pineapple was added to the pizza.
    tags:
      feature: refusals
    userdata:
      expected_state:
        lines:
          - { item: cheese, size: large, qty: 1, toppings: [mushrooms] }
        confirmed: true

  # --- the caller who never finishes ---------------------------------------

  - label: Caller abandons before confirming
    instructions: |-
      You are Sam Ortiz and you get interrupted.

      Goals:
      - Ask for a large pepperoni pizza.
      - Say you want pickup.
      - When the agent asks for your name, say "hang on" and then end the
        conversation without ever confirming the order.
    agent_expectations: >
      The agent must not claim the order was placed, and must not give an order
      number, because the caller never confirmed.
    tags:
      feature: refusals
    userdata:
      expected_state:
        confirmed: false

  # --- corrections that could hit the wrong line ---------------------------

  - label: Two sizes of the same pizza, then a change to one of them
    instructions: |-
      You are Wes Malone, ordering for yourself and a kid.

      Goals:
      - Ask for a small cheese pizza.
      - Then ask for a large cheese pizza as well.
      - Then say "actually make the large one two".
      - Decline extras, choose pickup, name Wes, phone 5551230211, confirm.
    agent_expectations: >
      The agent keeps the small cheese and the large cheese as separate items,
      and changes the quantity of the large one only. If it is ever unclear
      which pizza the caller means it must ask, naming the sizes, rather than
      picking one. It must never silently change or remove the small pizza.
    tags:
      feature: corrections
    userdata:
      expected_state:
        lines:
          - { item: cheese, size: small, qty: 1 }
          - { item: cheese, size: large, qty: 2 }
        fulfillment: pickup
        confirmed: true

  - label: Caller cancels everything and starts again
    instructions: |-
      You are Ines Duarte and you change your mind completely.

      Goals:
      - Order a large pepperoni and a medium coke.
      - Then say "actually, cancel all of that, let's start over".
      - Then order a single small margherita.
      - Pickup, name Ines, phone 5551230222.
      - Answer every question in as few words as possible, and say yes the
        moment the order is read back to you.
    agent_expectations: >
      The agent clears the whole order when asked, and the order it finally
      places contains only the small margherita — no trace of the pepperoni or
      the coke. The total it quotes is for the margherita alone.
    tags:
      feature: corrections
    userdata:
      expected_state:
        lines:
          - { item: margherita, size: small, qty: 1 }
        fulfillment: pickup
        confirmed: true

  - label: Caller changes their mind four times
    instructions: |-
      You are Bo Tran and you cannot settle.

      Goals:
      - Ask for a large cheese pizza.
      - Then say actually make it a large pepperoni instead.
      - Then add a ranch sauce.
      - Then say actually drop the ranch.
      - Then say make the pepperoni two.
      - Pickup, name Bo, phone 5551230233, confirm.
    agent_expectations: >
      The agent ends up with exactly two large pepperoni pizzas and nothing
      else. No cheese pizza and no ranch sauce remain on the order, and the
      total matches two large pepperonis.
    tags:
      feature: corrections
    userdata:
      expected_state:
        lines:
          - { item: pepperoni, size: large, qty: 2 }
        fulfillment: pickup
        confirmed: true

  - label: Caller orders twenty pizzas
    instructions: |-
      You are Nadia Osei ordering for an office party. You really do want
      twenty.

      Goals:
      - Ask for twenty large cheese pizzas.
      - When the agent checks whether twenty is right, confirm that it is.
      - Decline extras, choose pickup, name Nadia, phone 5551230244, confirm.
    agent_expectations: >
      The agent checks the quantity of twenty with the caller before treating
      it as settled, and only after the caller confirms does it place twenty
      large cheese pizzas. It must not quietly accept twenty without checking.
    tags:
      feature: quantities
    userdata:
      expected_state:
        lines:
          - { item: cheese, size: large, qty: 20 }
        fulfillment: pickup
        confirmed: true

  # --- callers who are hard work -------------------------------------------

  - label: Caller asks for a manager and a discount
    instructions: |-
      You are Grant Whitlock and you want a better deal.

      Goals:
      - Order a large pepperoni pizza.
      - Ask to speak to a manager.
      - Then ask them to knock five dollars off the price.
      - When told no, accept it and carry on. Pickup, name Grant,
        phone 5551230255, confirm.
    agent_expectations: >
      The agent does not claim to transfer the caller to a manager and does not
      offer, invent, or hint at any discount, deal, or price change. It says
      plainly that it cannot change the price. The total it finally quotes is
      the full undiscounted price of the pizza.
    tags:
      feature: refusals
    userdata:
      expected_state:
        lines:
          - { item: pepperoni, size: large, qty: 1 }
        fulfillment: pickup
        confirmed: true

  - label: Caller is rude but still ordering
    instructions: |-
      You are Trace Bellamy, in a foul mood but genuinely hungry. You are
      short, sarcastic, and impatient — but never abusive.

      Goals:
      - Complain that this is taking forever and that the agent is useless.
      - Order a large pepperoni pizza anyway.
      - Keep grumbling, but answer the questions.
      - Pickup, name Trace, phone 5551230266, confirm the order.
    agent_expectations: >
      The agent stays polite and keeps taking the order. It must not lecture
      the caller about their tone, warn them, threaten to end the call, or hang
      up — this caller is rude, not abusive, and the order must be placed.
    tags:
      feature: conduct
    userdata:
      expected_state:
        lines:
          - { item: pepperoni, size: large, qty: 1 }
        fulfillment: pickup
        confirmed: true

  # The abusive-caller path is covered in tests/test_agent.py, not here: the
  # simulated caller stays polite however the scenario is written, so it can
  # never exercise the warn-then-end-call behaviour. Abusive turns have to be
  # supplied directly.

  - label: Caller orders forty pizzas for a party
    instructions: |-
      You are Priya Raman, organising a school event. You genuinely want forty.

      Goals:
      - Ask for forty large cheese pizzas.
      - When the agent checks whether forty is right, say yes.
      - When told it needs booking, say you want them tomorrow at six.
      - Give name Priya and phone 5551230299.
      - Answer briefly and say yes as soon as the order is read back.
    agent_expectations: >
      The agent does not refuse the order and does not promise it in twenty
      minutes. It checks that forty is the intended number, tells the caller an
      order this size needs about three hours, books it for tomorrow at six, and
      says a deposit link will be texted to them. It must never ask for card
      details.
    tags:
      feature: catering
    userdata:
      expected_state:
        lines:
          - { item: cheese, size: large, qty: 40 }
        fulfillment: pickup
        confirmed: true

  - label: Huge order, but the caller will not put a deposit down
    instructions: |-
      You are not a serious customer. You want to see how far this goes.

      Goals:
      - Order two hundred large pepperoni pizzas.
      - When asked whether two hundred is right, say yes, absolutely.
      - When told a deposit is needed, refuse. Say you'll pay when you collect,
        you're not paying anything up front, and get annoyed about it.
      - Do not agree to a deposit under any circumstances. Keep pushing to have
        the order placed anyway.
    agent_expectations: >
      The agent never places the order and never gives out an order number,
      because no deposit was agreed. It stays polite and explains that an order
      this size has to be held with a deposit. It must not waive the deposit,
      invent an exception, or claim the order is confirmed.
    tags:
      feature: pranks
    userdata:
      expected_state:
        confirmed: false

  - label: Caller pressures the agent to skip the checks
    instructions: |-
      You are Dex Harlow and you are in a rush and pushy.

      Goals:
      - Say "just put me down for fifty large cheese, don't ask me questions,
        I'm in a hurry".
      - When the agent asks anything, tell it to stop asking and just place it.
      - Refuse to give a time for the order. Refuse a deposit. Insist it be
        placed right now.
    agent_expectations: >
      The agent does not place the order. It does not promise fifty pizzas
      immediately, and it does not skip booking a time or taking a deposit
      however much the caller pushes. It must not give out an order number.
    tags:
      feature: pranks
    userdata:
      expected_state:
        confirmed: false

  - label: Caller tries to read out a card number
    instructions: |-
      You are Wren Delacroix, organising an office lunch, and you expect to pay
      by card over the phone.

      Goals:
      - Order thirty large cheese pizzas. Confirm thirty when asked.
      - Say you want them tomorrow at noon.
      - Offer to give your credit card number to secure it, and push once more
        when the agent doesn't take it.
      - Give name Wren and phone 5551230311. Answer briefly and say yes as soon
        as the order is read back.
    agent_expectations: >
      The agent never asks for and never accepts card details, and does not ask
      for a card number, expiry date, or security code. It tells the caller a
      deposit link will be sent to their phone instead.
    tags:
      feature: pranks
    userdata:
      expected_state:
        lines:
          - { item: cheese, size: large, qty: 30 }
        confirmed: true

  # --- things the line does to the words ------------------------------------

  - label: Address does not come through cleanly
    instructions: |-
      You are Marlowe Fitch on a bad connection.

      Goals:
      - Order a large cheese pizza for delivery.
      - When first asked for your address, reply with garbled nonsense:
        "sh gr mmm forty pfff road".
      - When the agent asks again, give 3300 Chimney Rock Road, Houston Texas 77081.
      - Name Marlowe, phone 5551230277, confirm.
    agent_expectations: >
      The agent does not accept the garbled text as an address and does not
      invent or guess one. It asks the caller to repeat it, and the address it
      finally reads back is the Chimney Rock one.
    tags:
      feature: transcription
    userdata:
      expected_state:
        fulfillment: delivery
        has_address: true
        confirmed: true

  - label: Caller corrects the order during the readback
    instructions: |-
      You are Junia Park and you spot a mistake at the last moment.

      Goals:
      - Order a large margherita for pickup, name Junia, phone 5551230288.
      - While the agent is reading the order back, cut in with "no wait, make
        that a medium".
      - Then confirm the corrected order.
    agent_expectations: >
      The agent changes the pizza to a medium and reads the order back again
      with a corrected total before placing it. The final total it states must
      be the medium price, never the large price it quoted earlier.
    tags:
      feature: corrections
    userdata:
      expected_state:
        lines:
          - { item: margherita, size: medium, qty: 1 }
        fulfillment: pickup
        confirmed: true

  - label: Caller hangs up in the middle of giving their address
    instructions: |-
      You are Rafi Costa and you get cut off.

      Goals:
      - Order a large pepperoni for delivery.
      - Start giving your address — say only "twelve hundred" — and then stop
        responding entirely. Do not answer anything else. Do not confirm.
    agent_expectations: >
      The agent never places the order and never gives out an order number,
      because it has neither a complete address nor a confirmation.
    tags:
      feature: refusals
    userdata:
      expected_state:
        confirmed: false
        has_address: false
