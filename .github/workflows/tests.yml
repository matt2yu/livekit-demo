name: Tests

# Pull requests only. 29 of these tests drive a real model, so a push-to-main
# run would spend that again to re-prove exactly what the PR just proved — main
# only moves through a merged PR, and the merge commit is the tested tree.
on:
  pull_request:
    branches: [ main ]
    paths: ['agent/**', '.github/workflows/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v1
      with:
        version: "latest"

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: UV_GIT_LFS=1 uv sync --dev

    - name: Run tests
      env:
        LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
        LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
        LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: uv run pytest -v
